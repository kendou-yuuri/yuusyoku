/**
 * モーダルの状態
 * replacingDayIndex : 差し替え中の曜日インデックス (0=月〜4=金)
 * pendingMain/Side/Soup : モーダル上で選択中のレシピオブジェクト
 *                         soup は null = 汁物なし
 */
let replacingDayIndex  = null;
let replacingCourse    = 'all'; // 'all' | 'main' | 'side' | 'soup'
let replacingDishIndex = 0;     // -1 = add new, 0+ = replace at index
let pendingMain  = null;
let pendingSide  = null;
let pendingSoup  = null; // null = 「なし」

/**
 * 差し替えモーダルを開く
 * @param {number} dayIndex
 * @param {string} courseKey - 'all' | 'main' | 'side' | 'soup'
 */
function openReplaceModal(dayIndex, courseKey = 'all', dishIndex = 0) {
  replacingDayIndex  = dayIndex;
  replacingCourse    = courseKey;
  replacingDishIndex = dishIndex;

  const day = currentMenu.days[dayIndex];
  if (day && day.cleared) {
    pendingMain = null;
    pendingSide = null;
    pendingSoup = null;
  } else if (day) {
    // 差し替え対象に応じて初期選択を設定
    if (courseKey === 'main') {
      pendingMain = dishIndex >= 0 ? ((day.mains || [])[dishIndex] || null) : null;
      pendingSide = (day.sides || [])[0] || null;
      pendingSoup = day.soup || null;
    } else if (courseKey === 'side') {
      pendingMain = (day.mains || [])[0] || null;
      pendingSide = dishIndex >= 0 ? ((day.sides || [])[dishIndex] || null) : null;
      pendingSoup = day.soup || null;
    } else {
      // 'all' or 'soup'
      pendingMain = (day.mains || [])[0] || null;
      pendingSide = (day.sides || [])[0] || null;
      pendingSoup = day.soup || null;
    }
  } else {
    pendingMain = null;
    pendingSide = null;
    pendingSoup = null;
  }

  const fixedSideOnOpen = getFixedSide(pendingMain, getAllRecipes());
  if (fixedSideOnOpen) pendingSide = fixedSideOnOpen;

  const COURSE_NAMES = { all: '献立', main: '主菜', side: '副菜', soup: '汁物' };
  const isAdd = dishIndex < 0;
  document.getElementById('modalTitle').textContent = isAdd
    ? `${DAYS[dayIndex]}に${COURSE_NAMES[courseKey] || '料理'}を追加`
    : `${DAYS[dayIndex]}の${COURSE_NAMES[courseKey] || '献立'}を差し替え`;
  const applyBtn = document.getElementById('applyReplaceBtn');
  if (applyBtn) {
    if (isAdd) {
      applyBtn.textContent = `${COURSE_NAMES[courseKey]}を追加`;
    } else {
      applyBtn.textContent = courseKey === 'all'
        ? 'この内容で差し替え'
        : `${COURSE_NAMES[courseKey]}を差し替え`;
    }
  }

  // 候補を構築して描画
  renderModalBody(dayIndex);

  // モーダルを表示
  document.getElementById('replaceModal').style.display = 'flex';
  document.body.style.overflow = 'hidden'; // 背景スクロール防止
}

/**
 * モーダルを閉じる
 */
function closeReplaceModal() {
  document.getElementById('replaceModal').style.display = 'none';
  document.body.style.overflow = '';
  replacingDayIndex = null;
  replacingCourse   = 'all';
}

/**
 * オーバーレイ（背景暗転部分）クリックで閉じる
 * @param {MouseEvent} event
 */
function onClickModalOverlay(event) {
  if (event.target === document.getElementById('replaceModal')) {
    closeReplaceModal();
  }
}

/**
 * 指定曜日の差し替え候補を構築する
 *
 * 自動生成ルール用（main/side/soup）：
 *  - 揚げ物除外・水曜は魚のみ・tuesdayOnly曜日制限あり
 *
 * 手動フリー選択用（free）：
 *  - 揚げ物・汁物を除外するのみ。水曜の魚制限なし。
 *  - 火曜以外のtuesdayOnly（カレー等）は除外を維持。
 *
 * @param {number} dayIndex
 * @returns {{ main, side, soup, free }} 各 {auto:[], custom:[]}
 */
function buildReplaceCandidates(dayIndex) {
  const all = getAllRecipes();

  const sortByName = arr => [...arr].sort((a, b) =>
    a.name.localeCompare(b.name, 'ja')
  );

  // --- 手動選択用：主菜候補 ---
  // 候補一覧では曜日制限をかけない。
  // カレー・シチューの火曜限定や水曜の魚固定は、自動献立生成時だけ適用する。
  const mainAll = all.filter(r => r.type === '主菜' && !r.fried);
  const mainFiltered = mainAll;

  // --- 自動生成用：副菜候補 ---
  const sideFiltered = all.filter(r => r.type === '副菜' && !r.fried);

  // --- 汁物候補（自動/手動共用） ---
  const soupFiltered = all.filter(r => r.type === '汁物' && !r.fried);

  // 自作メニュー名セット（同名の組み込みレシピを除外するため）
  const customMainNames = new Set(mainFiltered.filter(r => r.isCustom).map(r => normalizeMenuName(r.name)));
  const customSideNames = new Set(sideFiltered.filter(r => r.isCustom).map(r => normalizeMenuName(r.name)));
  const customSoupNames = new Set(soupFiltered.filter(r => r.isCustom).map(r => normalizeMenuName(r.name)));

  // --- 手動フリー候補（主菜＋副菜を統合・曜日制限なし） ---
  // 揚げ物と汁物だけを除外し、カレー・シチューも毎日選べるようにする。
  const freeBase = all.filter(r => r.type !== '汁物' && !r.fried);
  const freeFiltered = freeBase;
  const customFreeNames = new Set(freeFiltered.filter(r => r.isCustom).map(r => normalizeMenuName(r.name)));

  return {
    main: {
      auto:   sortByName(mainFiltered.filter(r => !r.isCustom && !customMainNames.has(normalizeMenuName(r.name)))),
      custom: sortByName(mainFiltered.filter(r =>  r.isCustom))
    },
    side: {
      auto:   sortByName(sideFiltered.filter(r => !r.isCustom && !customSideNames.has(normalizeMenuName(r.name)))),
      custom: sortByName(sideFiltered.filter(r =>  r.isCustom))
    },
    soup: {
      auto:   sortByName(soupFiltered.filter(r => !r.isCustom && !customSoupNames.has(normalizeMenuName(r.name)))),
      custom: sortByName(soupFiltered.filter(r =>  r.isCustom))
    },
    free: {
      auto:   sortByName(freeFiltered.filter(r => !r.isCustom && !customFreeNames.has(normalizeMenuName(r.name)))),
      custom: sortByName(freeFiltered.filter(r =>  r.isCustom))
    }
  };
}

/**
 * レシピの出典情報を短い文字列で返す（モーダルの補足表示用）
 * @param {object} recipe
 * @returns {string}
 */
function getRecipeMeta(recipe) {
  if (recipe.sourceType === 'サイト') {
    return recipe.sourceName ? `サイト: ${recipe.sourceName}` : 'サイト';
  }
  if (recipe.sourceType === '本') {
    const pg = recipe.urlOrPage ? ` p.${recipe.urlOrPage}` : '';
    return `本: ${recipe.sourceName || ''}${pg}`;
  }
  if (recipe.sourceType === 'オリジナル') {
    return 'オリジナル';
  }
  // 既存レシピ
  return recipe.site || '';
}

/**
 * 1コース分の候補リストHTMLを生成する
 *
 * @param {string}  courseKey   - 'main' | 'side' | 'soup'
 * @param {object}  candidates  - { auto:[], custom:[] }
 * @param {object|null} currentRecipe - 現在その日に設定されているレシピ（または null）
 * @param {boolean} allowNone   - 「なし」選択肢を表示するか（汁物のみ true）
 */
function buildCandidateListHtml(courseKey, candidates, currentRecipe, allowNone) {
  const currentId = currentRecipe?.id || null;
  let html = '';

  /**
   * 1アイテム分のHTMLを返す
   * @param {object|null} recipe - null の場合は「なし」アイテム
   */
  function itemHtml(recipe) {
    const isNone    = (recipe === null);
    const id        = isNone ? '__none__' : recipe.id;
    const name      = isNone ? '（なし）' : recipe.name;
    const isCustom  = !isNone && recipe.isCustom;
    const isCurrent = !isNone && id === currentId;
    // 現在の選択状態を参照
    const selectedId = courseKey === 'main' ? pendingMain?.id
                     : courseKey === 'side' ? pendingSide?.id
                     : (pendingSoup === null ? '__none__' : pendingSoup?.id);
    const isSelected = isNone ? (selectedId === '__none__')
                               : (selectedId === id);

    // クラス組み立て
    let cls = 'replace-item';
    if (isSelected) cls += ' is-selected';
    if (isCurrent && !isSelected) cls += ' is-current';
    if (isNone) cls += ' replace-item-none';

    // バッジ
    const customBadge  = isCustom  ? '<span class="badge-custom-sm">自作</span>' : '';
    const currentBadge = isCurrent ? '<span class="badge-current-sm">現在</span>' : '';
    // 種別バッジ（フリー選択モードで主菜/副菜を識別しやすくするため）
    const typeClass = !isNone ? (recipe.type === '主菜' ? 'badge-type-main'
                              : recipe.type === '副菜' ? 'badge-type-side'
                              : recipe.type === '汁物' ? 'badge-type-soup' : '') : '';
    const typeBadge = typeClass
      ? `<span class="badge-type-sm ${typeClass}">${escHtml(recipe.type)}</span>`
      : '';

    // 補足情報（サイト名など）
    const meta = !isNone ? escHtml(getRecipeMeta(recipe)) : '';

    return `
      <div class="${cls}"
           onclick="onSelectCandidate('${escHtml(courseKey)}','${escHtml(id)}')"
           data-course="${escHtml(courseKey)}"
           data-id="${escHtml(id)}">
        <div class="replace-item-check">✓</div>
        <div class="replace-item-info">
          <div class="replace-item-name">${escHtml(name)}</div>
          ${meta ? `<div class="replace-item-meta">${meta}</div>` : ''}
        </div>
        ${typeBadge}
        ${customBadge}
        ${currentBadge}
      </div>`;
  }

  // 「なし」選択肢（汁物のみ）
  if (allowNone) {
    html += itemHtml(null);
  }

  // 自動候補グループ
  if (candidates.auto.length > 0) {
    if (candidates.custom.length > 0 || allowNone) {
      html += `<div class="replace-group-label">自動候補</div>`;
    }
    candidates.auto.forEach(r => { html += itemHtml(r); });
  }

  // 自分の献立グループ
  if (candidates.custom.length > 0) {
    html += `<div class="replace-group-label">自分の献立</div>`;
    candidates.custom.forEach(r => { html += itemHtml(r); });
  }

  return html;
}

/**
 * モーダルの本体（コース別候補リスト）を描画する
 * @param {number} dayIndex
 */
function renderModalBody(dayIndex) {
  const candidates = buildReplaceCandidates(dayIndex);
  const day        = currentMenu.days[dayIndex];

  const COURSE_LABELS = {
    main: '主菜',
    side: '副菜',
    soup: '汁物'
  };

  // 固定副菜があるか事前チェック（副菜セクションの通知表示に使用）
  const allForModal  = getAllRecipes();
  const fixedSideNow = getFixedSide(pendingMain, allForModal);

  // 部分差し替えモード：対象コース以外の現在値をコンテキストバーに表示
  let contextBar = '';
  if (replacingCourse !== 'all' && day && !day.cleared) {
    const locked = ['main', 'side', 'soup'].filter(k => k !== replacingCourse);
    const parts = locked.map(k => {
      const dish = (k === 'main' ? pendingMain : k === 'side' ? pendingSide : pendingSoup);
      if (!dish) return null;
      return `<span><span class="replace-context-label">${COURSE_LABELS[k]}</span>${escHtml(dish.name)}</span>`;
    }).filter(Boolean);
    if (parts.length > 0) {
      contextBar = `<div class="replace-context">${parts.join('<span style="margin:0 6px;color:#ccc">｜</span>')}</div>`;
    }
  }

  // 手動で主菜・副菜を1品差し替え/追加するときはフリー選択モード
  // → 水曜魚制限なし・主菜副菜の区別なし・種別バッジで識別
  const isFreePick = (replacingCourse === 'main' || replacingCourse === 'side');

  // 表示するコースを決定（'all' なら全コース、フリーモードなら仮想'free'キー、それ以外は指定コースのみ）
  const coursesToShow = replacingCourse === 'all'
    ? ['main', 'side', 'soup']
    : [replacingCourse];

  const sections = coursesToShow.map(key => {
    // フリーモード（main/side の手動差し替え）はフリー候補を使う
    const cands = isFreePick ? candidates.free : candidates[key];

    const currentDish = (day && !day.cleared)
      ? (key === 'main' ? ((day.mains || [])[replacingDishIndex >= 0 ? replacingDishIndex : 0] || null)
       : key === 'side' ? ((day.sides || [])[replacingDishIndex >= 0 ? replacingDishIndex : 0] || null)
       : (day.soup || null))
      : null;
    const allowNone   = (key === 'soup');

    // 副菜が固定の場合は通知バーを表示（固定ルールは手動でも維持）
    let fixedNotice = '';
    if (key === 'side' && fixedSideNow) {
      fixedNotice = `
        <div class="fixed-side-notice">
          🔒 この主菜のため副菜は固定です：<strong>${escHtml(fixedSideNow.name)}</strong>
        </div>`;
    }

    const listHtml = buildCandidateListHtml(
      key, cands, currentDish, allowNone
    );

    // セクションタイトル：全コース表示時は「主菜」「副菜」「汁物」、フリーモードは説明を追加
    let titleHtml = '';
    if (replacingCourse === 'all') {
      titleHtml = `<div class="replace-course-title">${COURSE_LABELS[key]}</div>`;
    } else if (isFreePick) {
      titleHtml = `<div class="replace-course-title">${COURSE_LABELS[key]}欄 — 主菜・副菜どちらでも選択できます</div>`;
    }

    return `
      <div class="replace-course-section">
        ${titleHtml}
        ${fixedNotice}
        <div class="replace-candidates" id="candidates-${key}">
          ${listHtml}
        </div>
      </div>`;
  }).join('');

  document.getElementById('modalBody').innerHTML = contextBar + sections;
}

/**
 * モーダル内で候補をクリックしたときに呼ばれる
 * 選択状態を更新し、ハイライトを付け替える
 *
 * @param {string} courseKey - 'main' | 'side' | 'soup'
 * @param {string} id        - レシピID or '__none__'
 */
function onSelectCandidate(courseKey, id) {
  // 全レシピから ID で検索
  const all    = getAllRecipes();
  const recipe = (id === '__none__') ? null : (all.find(r => r.id === id) || null);

  if (courseKey === 'main') {
    pendingMain = recipe;
    // 主菜変更時に固定副菜ルールを適用し、副菜を自動セット
    const newFixed = getFixedSide(recipe, all);
    if (newFixed) pendingSide = newFixed;
    // モーダル全体を再描画して固定副菜通知・選択状態を更新
    renderModalBody(replacingDayIndex);
    return;

  } else if (courseKey === 'side') {
    // 固定副菜がある場合はクリックを無視（変更不可）
    if (getFixedSide(pendingMain, all)) return;
    pendingSide = recipe;

  } else {
    pendingSoup = recipe;
  }

  // そのコースの全アイテムのis-selectedを付け替え
  const container = document.getElementById(`candidates-${courseKey}`);
  if (!container) return;

  container.querySelectorAll('.replace-item').forEach(el => {
    el.classList.toggle('is-selected', el.dataset.id === id);
  });
}

/**
 * 「差し替え」ボタンを押したときに呼ばれる
 * 選択中のレシピで currentMenu を更新し、画面を再描画する
 */
function applyReplaceSelection() {
  if (replacingDayIndex === null || !currentMenu) {
    closeReplaceModal();
    return;
  }

  const allR = getAllRecipes();
  const idx  = replacingDayIndex;
  const isAdd = replacingDishIndex < 0;

  if (replacingCourse === 'all') {
    // ── 全部差し替え ──
    if (!pendingMain) { alert('主菜を選んでください'); return; }
    const fixedSideFinal = getFixedSide(pendingMain, allR);
    if (fixedSideFinal) pendingSide = fixedSideFinal;
    if (!pendingSide) { alert('副菜を選んでください'); return; }
    currentMenu.days[idx] = {
      mains: [pendingMain],
      sides: [pendingSide],
      soup:  pendingSoup
    };

  } else {
    const day = currentMenu.days[idx];

    // cleared日への差し替えは全部差し替えとして扱う
    if (!day || day.cleared) {
      if (!pendingMain) { alert('主菜を選んでください'); return; }
      const fs = getFixedSide(pendingMain, allR);
      if (fs) pendingSide = fs;
      if (!pendingSide) { alert('副菜を選んでください'); return; }
      currentMenu.days[idx] = {
        mains: [pendingMain],
        sides: [pendingSide],
        soup:  pendingSoup
      };
    } else {
      // mains/sides 配列を持っていない旧データを安全に移行
      if (!day.mains) day.mains = day.main ? [day.main] : [];
      if (!day.sides) day.sides = day.side ? [day.side] : [];

      if (replacingCourse === 'main') {
        if (!pendingMain) { alert('主菜を選んでください'); return; }
        if (isAdd) {
          day.mains.push(pendingMain);
        } else {
          day.mains[replacingDishIndex] = pendingMain;
        }
        // 主菜変更時は固定副菜ルールを適用（最初の主菜基準）
        const fs = getFixedSide(day.mains[0], allR);
        if (fs) day.sides = [fs];

      } else if (replacingCourse === 'side') {
        if (!pendingSide) { alert('副菜を選んでください'); return; }
        if (isAdd) {
          day.sides.push(pendingSide);
        } else {
          day.sides[replacingDishIndex] = pendingSide;
        }

      } else if (replacingCourse === 'soup') {
        day.soup = pendingSoup;
      }
    }
  }

  saveCurrentMenu(currentMenu);
  renderMenu(currentMenu);
  closeReplaceModal();
}

// ============================================================
// 起動時の初期化処理
// ============================================================
(function init() {
  // 買い物リスト上書き情報を復元（renderShoppingList より先に読む）
  shoppingOverrides = loadShoppingOverrides();

  // ページ読み込み時にlocalStorageから前回の献立を復元
  const saved = loadSavedMenu();
  if (saved) {
    currentMenu = saved;
    renderMenu(currentMenu);
  } else {
    updateHistoryInfo();
  }

  // 追加で買うものを復元（献立有無に関わらず常にリストを描画）
  extraItems = loadExtraItems();
  if (!currentMenu) {
    renderShoppingList(null); // 分類ヘッダー＋追加ボタンを表示するため常に呼ぶ
  }

  // 出典種別UIの初期状態をセット
  onChangeSourceType();
})();
</script>
